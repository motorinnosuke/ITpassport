<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITパスポート 対策アプリ</title>
<style>
  :root{
    --bg:#0d1117;
    --panel:#161b22;
    --panel2:#1c2530;
    --line:#2a3441;
    --ink:#e8eef5;
    --muted:#8b97a7;
    --accent:#4cc9b0;
    --accent2:#f2a65a;
    --correct:#3fb950;
    --wrong:#f0506e;
    --strat:#6ea8fe;
    --manage:#f2a65a;
    --tech:#4cc9b0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(76,201,176,.10), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(110,168,254,.10), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px}
  /* PCサイズではブラウザ幅に応じて広げる(上限あり) */
  @media(min-width:821px){
    .wrap{max-width:min(1280px, 92vw);padding:36px 32px 80px}
  }
  @media(min-width:1100px){
    /* クイズ画面: 問題文と選択肢を左右2カラムで広く使う */
    #quiz .card{max-width:none}
    #quiz .qtext{font-size:2rem;margin-bottom:36px}
    .opt{font-size:1.6rem;padding:26px 30px}
    .opt .k{flex:0 0 46px;height:46px;font-size:1.25rem}
    /* 結果画面のレビューも読みやすく */
    #result .review-item .rq{font-size:1rem}
  }

  /* クイズ画面はビューポート高さを使い切る */
  @media(min-width:821px) and (min-height:600px){
    #quiz .card{
      min-height: calc(100vh - 180px);
      display:flex;
      flex-direction:column;
    }
    #quiz .opts{
      flex:1;
      justify-content:center;
    }
    #quiz .opt{
      min-height:92px;
      align-items:center;
    }
    #quiz .navrow{
      margin-top:auto;
      padding-top:18px;
    }
  }
  header.app{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px;
  }
  header.app h1{
    font-size:1.85rem;font-weight:800;letter-spacing:.02em;
    background:linear-gradient(100deg,var(--accent),var(--strat));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  header.app .sub{color:var(--muted);font-size:.98rem}
  .badge{
    margin-left:auto;font-size:.85rem;color:var(--muted);
    border:1px solid var(--line);padding:6px 14px;border-radius:999px;
  }

  .card{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--line);border-radius:16px;
    padding:24px;margin-bottom:18px;
  }
  h2{font-size:1.35rem;margin-bottom:18px;font-weight:700}
  p.lead{color:var(--muted);font-size:1.05rem;margin-bottom:22px;line-height:1.7}

  .modes{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.modes{grid-template-columns:1fr}}
  .mode-btn{
    text-align:left;background:#11161d;border:1px solid var(--line);
    border-radius:12px;padding:20px 22px;cursor:pointer;color:var(--ink);
    transition:.16s;font-family:inherit;
  }
  .mode-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
  .mode-btn .t{font-weight:700;font-size:1.2rem;margin-bottom:6px}
  .mode-btn .d{color:var(--muted);font-size:.98rem;line-height:1.6}

  .fields{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
  .chip{
    border:1px solid var(--line);background:#11161d;color:var(--ink);
    border-radius:999px;padding:10px 20px;cursor:pointer;font-size:1.02rem;
    font-family:inherit;transition:.14s;
  }
  .chip[data-on="1"]{border-color:var(--accent);background:rgba(76,201,176,.12);color:var(--accent)}
  .chip.s[data-on="1"]{border-color:var(--strat);background:rgba(110,168,254,.12);color:var(--strat)}
  .chip.m[data-on="1"]{border-color:var(--manage);background:rgba(242,166,90,.14);color:var(--accent2)}

  .startbar{display:flex;align-items:center;gap:14px;margin-top:22px;flex-wrap:wrap}
  .btn{
    background:linear-gradient(100deg,var(--accent),#3aa792);
    color:#04241e;border:none;border-radius:10px;padding:13px 28px;
    font-weight:800;font-size:1.05rem;cursor:pointer;font-family:inherit;
    transition:.15s;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
  .stat{background:#11161d;border:1px solid var(--line);border-radius:12px;padding:18px;text-align:center}
  .stat .n{font-size:2rem;font-weight:800}
  .stat .l{color:var(--muted);font-size:.92rem;margin-top:4px}

  /* Quiz */
  .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .qmeta{color:var(--muted);font-size:.8rem}
  .tag{font-size:.7rem;padding:3px 9px;border-radius:999px;font-weight:700}
  .tag.s{background:rgba(110,168,254,.16);color:var(--strat)}
  .tag.m{background:rgba(242,166,90,.16);color:var(--accent2)}
  .tag.t{background:rgba(76,201,176,.16);color:var(--tech)}
  .progress{height:6px;background:#11161d;border-radius:999px;overflow:hidden;margin:14px 0 22px}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--strat));transition:width .3s}
  .qtext{font-size:1.7rem;font-weight:600;margin-bottom:30px;white-space:pre-wrap;line-height:1.8}
  .opts{display:flex;flex-direction:column;gap:16px}
  .opt{
    text-align:left;background:#11161d;border:1px solid var(--line);
    border-radius:10px;padding:22px 26px;cursor:pointer;color:var(--ink);
    font-family:inherit;font-size:1.4rem;transition:.13s;display:flex;gap:16px;align-items:flex-start;
    line-height:1.7;
  }
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt .k{
    flex:0 0 38px;height:38px;border-radius:8px;border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:var(--muted)
  }
  .opt.correct{border-color:var(--correct);background:rgba(63,185,80,.12)}
  .opt.correct .k{border-color:var(--correct);color:var(--correct)}
  .opt.wrong{border-color:var(--wrong);background:rgba(240,80,110,.12)}
  .opt.wrong .k{border-color:var(--wrong);color:var(--wrong)}
  .opt:disabled{cursor:default}

  .explain{
    margin-top:18px;border-left:3px solid var(--accent);
    background:#11161d;border-radius:0 10px 10px 0;padding:16px 20px;
    font-size:.98rem;color:#cdd7e3;display:none;line-height:1.75;
  }
  .explain.show{display:block;animation:fade .25s ease}
  .explain b{color:var(--accent)}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

  .navrow{display:flex;justify-content:space-between;margin-top:24px;gap:10px}
  /* クイズ画面: 次へを中央に大きく、中断は右に小さく */
  #quiz .navrow{
    position:relative;
    justify-content:center;
    align-items:center;
  }
  #quiz #nextBtn{
    font-size:1.25rem;
    padding:18px 64px;
    border-radius:12px;
    min-width:240px;
  }
  #quiz #quitBtn{
    position:absolute;
    right:0;
    top:50%;
    transform:translateY(-50%);
    font-size:.85rem;
    padding:9px 16px;
  }
  @media(max-width:560px){
    #quiz .navrow{flex-direction:column;gap:14px}
    #quiz #quitBtn{position:static;transform:none}
  }
  @media(min-width:1100px){
    #quiz #nextBtn{font-size:1.45rem;padding:22px 80px;min-width:300px}
  }

  /* Result */
  .score-big{font-size:3.4rem;font-weight:800;text-align:center;margin:8px 0}
  .score-big small{font-size:1rem;color:var(--muted);font-weight:600}
  .verdict{text-align:center;font-weight:700;margin-bottom:20px}
  .pass{color:var(--correct)}.fail{color:var(--wrong)}
  .breakdown{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .brow{display:flex;align-items:center;gap:12px}
  .brow .nm{flex:0 0 110px;font-size:.85rem}
  .brow .bar{flex:1;height:10px;background:#11161d;border-radius:999px;overflow:hidden}
  .brow .bar > i{display:block;height:100%}
  .brow .pct{flex:0 0 56px;text-align:right;font-size:.82rem;color:var(--muted)}

  .review-item{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;background:#11161d}
  .review-item .rq{font-weight:600;font-size:.9rem;margin-bottom:8px}
  .review-item .ra{font-size:.83rem;color:var(--muted)}
  .review-item .ra .ok{color:var(--correct)}
  .review-item .ra .ng{color:var(--wrong)}
  .hidden{display:none}
  footer{color:var(--muted);font-size:.74rem;text-align:center;margin-top:30px;line-height:1.6}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div>
      <h1>ITパスポート 対策アプリ</h1>
      <div class="sub">IPA シラバス準拠 / 4択 / 自動採点</div>
    </div>
    <span class="badge" id="poolBadge">問題読込中…</span>
  </header>

  <!-- HOME -->
  <section id="home">
    <div class="card">
      <h2>学習モードを選ぶ</h2>
      <p class="lead">出題分野を選んでからモードを開始します(初期は全分野ON)。</p>
      <div class="fields" id="fieldChips">
        <button class="chip s" data-f="strategy" data-on="1">ストラテジ系</button>
        <button class="chip m" data-f="management" data-on="1">マネジメント系</button>
        <button class="chip" data-f="technology" data-on="1">テクノロジ系</button>
      </div>
      <div class="modes" style="margin-top:20px">
        <button class="mode-btn" data-mode="field">
          <div class="t">分野別演習</div>
          <div class="d">選択した分野からランダム出題。解くたびに即採点+解説。</div>
        </button>
        <button class="mode-btn" data-mode="random">
          <div class="t">ランダム10問</div>
          <div class="d">全選択分野からランダムに10問。実力チェック向け。</div>
        </button>
        <button class="mode-btn" data-mode="mock">
          <div class="t">本番模試(100問)</div>
          <div class="d">本試験を再現。総合6割+各分野3割で合格判定。</div>
        </button>
        <button class="mode-btn" data-mode="review">
          <div class="t">間違えた問題の復習</div>
          <div class="d">過去に誤答した問題だけを再出題(履歴保存時)。</div>
        </button>
      </div>
    </div>

    <div class="card">
      <h2>これまでの学習</h2>
      <div class="stat-row">
        <div class="stat"><div class="n" id="stTotal">0</div><div class="l">累計解答数</div></div>
        <div class="stat"><div class="n" id="stRate">–</div><div class="l">累計正答率</div></div>
        <div class="stat"><div class="n" id="stWeak">0</div><div class="l">復習候補</div></div>
      </div>
      <div class="startbar">
        <button class="btn ghost" id="resetBtn">学習履歴をリセット</button>
        <span class="qmeta" id="storeNote"></span>
      </div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="card">
      <div class="qhead">
        <span class="qmeta" id="qCounter">1 / 20</span>
        <span class="tag" id="qTag">分野</span>
      </div>
      <div class="progress"><i id="qBar" style="width:0%"></i></div>
      <div class="qtext" id="qText"></div>
      <div class="opts" id="qOpts"></div>
      <div class="explain" id="qExplain"></div>
      <div class="navrow">
        <button class="btn" id="nextBtn" disabled>次へ</button>
        <button class="btn ghost" id="quitBtn">中断してホームへ</button>
      </div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden">
    <div class="card">
      <h2>採点結果</h2>
      <div class="score-big" id="rScore">0<small>/0</small></div>
      <div class="verdict" id="rVerdict"></div>
      <div class="breakdown" id="rBreak"></div>
      <div class="startbar">
        <button class="btn" id="againBtn">もう一度ホームへ</button>
        <button class="btn ghost" id="toggleReview">解答を確認</button>
      </div>
    </div>
    <div class="card hidden" id="reviewCard">
      <h2>解答レビュー</h2>
      <div id="reviewList"></div>
    </div>
  </section>
</div>

<script>
/* =========================================================================
   問題データ  field: strategy / management / technology
   ※ IPA ITパスポート シラバスの出題範囲に準拠した学習用問題
   ========================================================================= */
const QUESTIONS = [
/* ---------- ストラテジ系 ---------- */
{f:"strategy",q:"企業の経営理念を実現するための、中長期的な方向性や目標を示したものはどれか。",
 o:["現場作業の手順を細かく定めた業務マニュアル", "中長期の方向性と目標を示す経営戦略", "従業員の勤務条件を定めた就業規則", "日常作業の標準的な進め方を示す作業手順書"],a:1,
 e:"経営戦略は経営理念を実現するための中長期の方向性・目標を示すもの。マニュアルや手順書は日常業務の具体的なやり方を示す文書で目的が異なる。"},
{f:"strategy",q:"SWOT分析における「機会(Opportunity)」に該当するものはどれか。",
 o:["独自技術と高い研究開発力という自社の優位性", "市場の急成長や規制緩和などの外部環境変化", "従業員の高齢化と若手人材の不足", "競合企業の積極的な新製品投入と価格攻勢"],a:1,
 e:"SWOTは強み・弱み(内部要因)、機会・脅威(外部要因)。市場の急成長は外部のプラス要因=機会。"},
{f:"strategy",q:"PPMで市場成長率が高く市場占有率も高い事業区分はどれか。",
 o:["成熟市場で高シェアを維持する金のなる木", "成長市場で高シェアを持つ花形", "成長市場だが低シェアの問題児", "成熟市場で低シェアの負け犬"],a:1,
 e:"PPMでは成長率(縦)・占有率(横)で4区分。両方高いのが花形、占有率のみ高いのが金のなる木。"},
{f:"strategy",q:"自社の中核となる強み(真似されにくい独自能力)を指す用語はどれか。",
 o:["他社が容易に模倣できない中核能力のコアコンピタンス", "他社と協業関係を結ぶアライアンス", "業務を外部委託するアウトソーシング", "優れた他社事例を分析するベンチマーキング"],a:0,
 e:"コアコンピタンスは他社が容易に模倣できない自社固有の中核能力。ベンチマーキングは他社事例との比較分析。"},
{f:"strategy",q:"複数企業が共同出資して新会社を設立する形態はどれか。",
 o:["既存企業を統合または買収するM&A", "複数企業の共同出資で新会社を作るジョイントベンチャ", "本部が加盟店に運営権を与えるフランチャイズ", "委託元のブランドで製造を請け負うOEM"],a:1,
 e:"ジョイントベンチャは複数企業が共同出資して新会社を設立する形態。OEMは相手先ブランドによる製造。"},
{f:"strategy",q:"顧客との関係を維持・強化し、長期的な収益向上を目指す経営手法はどれか。",
 o:["原材料調達から販売までの供給連鎖を最適化するSCM", "顧客との関係構築を通じて長期収益を狙うCRM", "経営資源を統合管理するERP", "営業活動を支援するSFA"],a:1,
 e:"CRMは顧客満足度・ロイヤルティ向上で長期収益を目指す。SCMは供給連鎖管理、ERPは経営資源の統合管理。"},
{f:"strategy",q:"企業の業務プロセスを抜本的に見直し、再設計する経営手法はどれか。",
 o:["業務プロセスを根本から再設計するBPR", "災害時に事業継続を図るBCP", "業績を測定する重要評価指標のKPI", "企業の社会的責任を果たすCSR"],a:0,
 e:"BPRは業務プロセスの抜本的再設計。BCPは事業継続計画、CSRは企業の社会的責任。"},
{f:"strategy",q:"損益分岐点売上高を求める式として正しいものはどれか。",
 o:["固定費÷(1−変動費率)", "固定費×変動費率", "売上高−変動費", "固定費+変動費"],a:0,
 e:"損益分岐点売上高=固定費÷限界利益率=固定費÷(1−変動費率)。利益がゼロになる売上高。"},
{f:"strategy",q:"知的財産権のうち、プログラムやデータベースを保護する権利はどれか。",
 o:["発明を保護し出願審査を経て付与される特許権", "物品の構造や形状の考案を保護する実用新案権", "創作的表現を自動的に保護する著作権", "商品やサービスの識別標識を保護する商標権"],a:2,
 e:"プログラムやデータベースは著作物として著作権で保護される。特許権は発明、商標権は識別標識を保護。"},
{f:"strategy",q:"発明を保護し、出願・審査を経て付与され存続期間が定められている権利はどれか。",
 o:["創作的表現を自動的に保護する著作権", "発明を保護し審査を経て付与される特許権", "秘密として管理される情報を保護する営業秘密", "他人の肖像の無断利用を制限する肖像権"],a:1,
 e:"特許権は発明を保護し、出願・審査を経て登録され、原則出願から20年で存続期間が満了する。"},
{f:"strategy",q:"企業間の電子商取引を表す用語はどれか。",
 o:["企業対消費者の電子商取引BtoC", "企業間の電子商取引BtoB", "消費者間の電子商取引CtoC", "行政から消費者へのサービスGtoC"],a:1,
 e:"BtoBは企業間取引。BtoCは企業対消費者、CtoCは消費者間取引。"},
{f:"strategy",q:"IoTの説明として最も適切なものはどれか。",
 o:["コンピュータが自律的に学習し判断する人工知能", "あらゆるモノをインターネットに接続する仕組み", "遠隔で参加できる仮想空間の会議システム", "大量データを高速集計する分析用データベース"],a:1,
 e:"IoTはセンサなどを備えた多様なモノをインターネットに接続し、情報の収集・制御を行う仕組み。"},
{f:"strategy",q:"一定期間の経営成績(収益と費用)を示す財務諸表はどれか。",
 o:["一時点の資産・負債・純資産を示す貸借対照表", "一定期間の収益と費用を示す損益計算書", "現金の収支を示すキャッシュフロー計算書", "株主資本の増減を示す株主資本等変動計算書"],a:1,
 e:"損益計算書(P/L)は一定期間の収益・費用・利益を示す。貸借対照表(B/S)は一時点の資産・負債・純資産を示す。"},
{f:"strategy",q:"複数の商品をセット販売する手法はどれか。",
 o:["需要や時期で価格を変動させるダイナミックプライシング", "複数商品を組み合わせて販売するバンドリング", "定額制で継続課金するサブスクリプション", "基本機能を無料、付加機能を有料にするフリーミアム"],a:1,

/* ============================ 状態 ============================ */
const FIELD_LABEL = {strategy:"ストラテジ系", management:"マネジメント系", technology:"テクノロジ系"};
const FIELD_TAG   = {strategy:"s", management:"m", technology:"t"};
const STORE_KEY   = "itp_progress_v1";

let store = loadStore();
let session = null;

const $ = s => document.querySelector(s);
const view = id => {
  ["home","quiz","result"].forEach(v=>$("#"+v).classList.add("hidden"));
  $("#"+id).classList.remove("hidden");
  window.scrollTo(0,0);
};

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* localStorage 不可環境 */ }
  return {total:0, correct:0, wrongIds:[]};
}
function saveStore(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
    $("#storeNote").textContent = "履歴は自動保存されています";
  }catch(e){
    $("#storeNote").textContent = "※この環境では履歴を保存できません(自分のPC/サーバーに置くと保存可)";
  }
}
function qId(qObj){ return QUESTIONS.indexOf(qObj); }

/* 分野チップ */
$("#fieldChips").addEventListener("click",e=>{
  const c = e.target.closest(".chip"); if(!c) return;
  const on = c.getAttribute("data-on")==="1";
  // 最低1つは残す
  const active = [...document.querySelectorAll('.chip[data-on="1"]')];
  if(on && active.length===1) return;
  c.setAttribute("data-on", on?"0":"1");
});
function selectedFields(){
  return [...document.querySelectorAll('.chip[data-on="1"]')].map(c=>c.getAttribute("data-f"));
}

/* モード開始 */
document.querySelector(".modes").addEventListener("click",e=>{
  const b = e.target.closest(".mode-btn"); if(!b) return;
  startMode(b.getAttribute("data-mode"));
});

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startMode(mode){
  const fields = selectedFields();
  let pool = QUESTIONS.filter(q=>fields.includes(q.f));
  let count;

  if(mode==="field"){ count = Math.min(15, pool.length); }
  else if(mode==="random"){ count = Math.min(10, pool.length); }
  else if(mode==="mock"){
    pool = QUESTIONS.slice(); // 模試は全分野
    count = Math.min(100, pool.length);
  }
  else if(mode==="review"){
    const ids = store.wrongIds || [];
    pool = ids.map(i=>QUESTIONS[i]).filter(Boolean);
    if(pool.length===0){ alert("復習対象の問題がありません。まずは演習で問題を解いてみましょう。"); return; }
    count = pool.length;
  }

  const picked = shuffle(pool).slice(0,count).map(q=>{
    // 選択肢シャッフル(正解インデックスを追跡)
    const idx = q.o.map((_,i)=>i);
    const sh = shuffle(idx);
    return {
      ref:q,
      opts: sh.map(i=>q.o[i]),
      ans: sh.indexOf(q.a),
      chosen:null
    };
  });

  session = {mode, list:picked, cur:0, score:0};
  renderQ();
  view("quiz");
}

function renderQ(){
  const s = session, it = s.list[s.cur];
  $("#qCounter").textContent = `${s.cur+1} / ${s.list.length}`;
  const tg = $("#qTag");
  tg.className = "tag " + FIELD_TAG[it.ref.f];
  tg.textContent = FIELD_LABEL[it.ref.f];
  $("#qBar").style.width = (s.cur/s.list.length*100)+"%";
  $("#qText").textContent = it.ref.q;

  const box = $("#qOpts"); box.innerHTML="";
  const keys=["A","B","C","D"];
  it.opts.forEach((txt,i)=>{
    const btn=document.createElement("button");
    btn.className="opt";
    btn.innerHTML=`<span class="k">${keys[i]}</span><span>${txt}</span>`;
    btn.addEventListener("click",()=>choose(i));
    if(it.chosen!==null) btn.disabled=true;
    box.appendChild(btn);
  });

  const ex=$("#qExplain"); ex.className="explain"; ex.innerHTML="";
  $("#nextBtn").disabled = (it.chosen===null);
  $("#nextBtn").textContent = (s.cur===s.list.length-1)?"採点する":"次へ";

  if(it.chosen!==null) revealAnswer(it,false);

  window.scrollTo({top:0, behavior:"smooth"});
}

function choose(i){
  const s=session, it=s.list[s.cur];
  if(it.chosen!==null) return;
  it.chosen=i;
  const correct = (i===it.ans);
  if(correct) s.score++;

  // 履歴更新
  store.total++;
  if(correct){
    store.correct++;
    store.wrongIds = (store.wrongIds||[]).filter(id=>id!==qId(it.ref));
  }else{
    if(!store.wrongIds) store.wrongIds=[];
    const id=qId(it.ref);
    if(!store.wrongIds.includes(id)) store.wrongIds.push(id);
  }
  saveStore();
  revealAnswer(it,true);
}

function revealAnswer(it,animate){
  const btns=[...document.querySelectorAll("#qOpts .opt")];
  btns.forEach((b,idx)=>{
    b.disabled=true;
    if(idx===it.ans) b.classList.add("correct");
    if(idx===it.chosen && it.chosen!==it.ans) b.classList.add("wrong");
  });
  const ex=$("#qExplain");
  const ok = it.chosen===it.ans;
  ex.innerHTML = `<b>${ok?"正解":"不正解"}</b> ｜ 正答: ${["A","B","C","D"][it.ans]}<br>${it.ref.e}`;
  ex.className = "explain show";
  $("#nextBtn").disabled=false;
}

$("#nextBtn").addEventListener("click",()=>{
  const s=session;
  if(s.cur < s.list.length-1){ s.cur++; renderQ(); }
  else showResult();
});
$("#quitBtn").addEventListener("click",()=>{ if(confirm("中断してホームに戻りますか?(この回の結果は保存されません)")){ refreshHome(); view("home"); }});

function showResult(){
  const s=session;
  const total=s.list.length, sc=s.score;
  const pctAll = Math.round(sc/total*100);
  $("#rScore").innerHTML = `${sc}<small> / ${total}</small>`;

  // 分野別集計
  const byF={};
  s.list.forEach(it=>{
    const f=it.ref.f;
    byF[f]=byF[f]||{c:0,n:0};
    byF[f].n++;
    if(it.chosen===it.ans) byF[f].c++;
  });

  // 合格判定(模試): 総合60%以上 かつ 各分野30%以上
  let verdict;
  if(s.mode==="mock"){
    let pass = pctAll>=60;
    Object.values(byF).forEach(v=>{ if(v.c/v.n < 0.30) pass=false; });
    verdict = pass
      ? `<span class="pass">合格ライン到達(総合6割+各分野3割)</span>`
      : `<span class="fail">基準未達 — 総合6割・各分野3割を目指しましょう</span>`;
  }else{
    verdict = pctAll>=80 ? `<span class="pass">よくできています(${pctAll}%)</span>`
            : pctAll>=60 ? `合格圏内まであと一息(${pctAll}%)`
            : `<span class="fail">基礎の復習を重点的に(${pctAll}%)</span>`;
  }
  $("#rVerdict").innerHTML = verdict;

  const colors={strategy:"var(--strat)",management:"var(--accent2)",technology:"var(--tech)"};
  $("#rBreak").innerHTML = Object.keys(byF).map(f=>{
    const v=byF[f], p=Math.round(v.c/v.n*100);
    return `<div class="brow">
      <span class="nm">${FIELD_LABEL[f]}</span>
      <span class="bar"><i style="width:${p}%;background:${colors[f]}"></i></span>
      <span class="pct">${v.c}/${v.n}</span>
    </div>`;
  }).join("");

  // レビュー
  $("#reviewList").innerHTML = s.list.map((it,i)=>{
    const ok=it.chosen===it.ans;
    const chosenTxt = it.chosen!=null ? it.opts[it.chosen] : "(無回答)";
    return `<div class="review-item">
      <div class="rq">Q${i+1}. ${it.ref.q}</div>
      <div class="ra">あなたの解答: <span class="${ok?'ok':'ng'}">${chosenTxt}</span><br>
      正答: <span class="ok">${it.opts[it.ans]}</span><br>
      <span style="color:#aab6c5">${it.ref.e}</span></div>
    </div>`;
  }).join("");
  $("#reviewCard").classList.add("hidden");
  $("#toggleReview").textContent="解答を確認";

  view("result");
}

$("#toggleReview").addEventListener("click",()=>{
  const c=$("#reviewCard");
  const hidden=c.classList.toggle("hidden");
  $("#toggleReview").textContent = hidden ? "解答を確認" : "解答を隠す";
});
$("#againBtn").addEventListener("click",()=>{ refreshHome(); view("home"); });

$("#resetBtn").addEventListener("click",()=>{
  if(confirm("学習履歴(累計成績・復習リスト)を全て削除します。よろしいですか?")){
    store={total:0,correct:0,wrongIds:[]};
    saveStore(); refreshHome();
  }
});

function refreshHome(){
  $("#stTotal").textContent = store.total;
  $("#stRate").textContent  = store.total ? Math.round(store.correct/store.total*100)+"%" : "–";
  $("#stWeak").textContent  = (store.wrongIds||[]).length;
}

/* 初期化 */
(function init(){
  $("#poolBadge").textContent = `収録 ${QUESTIONS.length} 問`;
  refreshHome();
  // 保存可否のメッセージを初期表示
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); $("#storeNote").textContent="履歴は自動保存されています"; }
  catch(e){ $("#storeNote").textContent="※この環境では履歴を保存できません(自分のPC/サーバーに置くと保存可)"; }
})();
</script>
