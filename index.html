<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITパスポート 4択対策アプリ</title>
<style>
:root {
  --bg:#f6f7fb; --card:#fff; --ink:#172033; --muted:#657089; --line:#d9deea;
  --accent:#335cff; --good:#12805c; --bad:#c9362c; --warn:#a56a00;
}
* { box-sizing:border-box; }
body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink); }
header { position:sticky; top:0; z-index:3; background:rgba(246,247,251,.92); backdrop-filter: blur(10px); border-bottom:1px solid var(--line); }
.wrap { max-width:1100px; margin:0 auto; padding:18px; }
h1 { margin:0 0 8px; font-size: clamp(22px,4vw,34px); }
.lead { color:var(--muted); margin:0; line-height:1.7; }
.panel { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:16px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; box-shadow:0 2px 10px rgba(20,30,50,.04); }
.stat b { display:block; font-size:22px; }
.controls { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
button, select, input { font:inherit; }
button { border:0; border-radius:12px; padding:10px 14px; cursor:pointer; background:var(--accent); color:#fff; font-weight:700; }
button.secondary { background:#e9ecf8; color:var(--ink); }
button.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
select, input { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:12px; padding:10px; }
main.wrap { padding-top:18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; margin:14px 0; box-shadow:0 8px 24px rgba(20,30,50,.06); }
.meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; color:var(--muted); font-size:14px; }
.badge { border:1px solid var(--line); border-radius:999px; padding:4px 9px; background:#f9fafc; }
.q { font-size:18px; line-height:1.65; font-weight:750; margin:8px 0 14px; }
.choices { display:grid; gap:10px; }
.choice { width:100%; text-align:left; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:14px; padding:12px 14px; font-weight:650; }
.choice:hover { border-color:var(--accent); }
.choice.correct { background:#e9f8f1; border-color:var(--good); color:#06452f; }
.choice.wrong { background:#fff0ef; border-color:var(--bad); color:#721c18; }
.choice:disabled { cursor:default; opacity:1; }
.explain { display:none; margin-top:12px; padding:12px; border-radius:14px; background:#f6f7fb; border:1px solid var(--line); line-height:1.7; }
.explain.show { display:block; }
.result { font-weight:800; margin-bottom:6px; }
.result.good { color:var(--good); }
.result.bad { color:var(--bad); }
.footerbar { position:sticky; bottom:0; background:rgba(246,247,251,.94); border-top:1px solid var(--line); padding:10px 0; backdrop-filter: blur(10px); }
.progress { height:10px; background:#e3e7f2; border-radius:999px; overflow:hidden; }
.progress > div { height:100%; background:var(--accent); width:0%; transition:.2s; }
.small { font-size:13px; color:var(--muted); line-height:1.7; }
.hidden { display:none; }
@media (max-width:760px) {
  .panel { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .controls { flex-direction:column; }
  button, select, input { width:100%; }
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>ITパスポート 4択対策アプリ</h1>
    <p class="lead">全103問。オリジナル問題。ストラテジ・マネジメント・テクノロジを横断して、選択すると自動採点します。</p>
    <div class="panel">
      <div class="stat"><span>出題数</span><b id="total">0</b></div>
      <div class="stat"><span>解答済み</span><b id="done">0</b></div>
      <div class="stat"><span>正解</span><b id="correct">0</b></div>
      <div class="stat"><span>正答率</span><b id="rate">0%</b></div>
    </div>
    <div class="controls">
      <select id="category">
        <option value="all">全分野</option>
        <option value="ストラテジ">ストラテジ系</option>
        <option value="マネジメント">マネジメント系</option>
        <option value="テクノロジ">テクノロジ系</option>
        <option value="wrong">間違えた問題だけ</option>
      </select>
      <input id="keyword" placeholder="キーワード検索 例：セキュリティ、SQL、SLA">
      <button id="shuffle">シャッフル</button>
      <button id="reset" class="secondary">解答リセット</button>
      <button id="review" class="ghost">解説をすべて表示</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="card small">
    使い方：選択肢を押すと即採点され、正解と解説が表示されます。試験本番は100問・120分・四肢択一式なので、まずは全問を一周し、間違えた問題だけで復習してください。
  </div>
  <section id="list"></section>
</main>

<div class="footerbar">
  <div class="wrap">
    <div class="progress" aria-label="progress"><div id="bar"></div></div>
  </div>
</div>

<script>
const QUESTIONS = [{"id": 1, "category": "ストラテジ", "topic": "企業と法務", "question": "企業の社会的責任を表す用語はどれか。", "choices": ["CSR", "SLA", "RPA", "BYOD"], "answer": 0, "explanation": "CSRは企業が社会・環境・倫理などに配慮して責任ある活動を行う考え方です。"}, {"id": 2, "category": "ストラテジ", "topic": "企業と法務", "question": "損益計算書で売上高から売上原価を差し引いた利益はどれか。", "choices": ["営業利益", "経常利益", "売上総利益", "当期純利益"], "answer": 2, "explanation": "売上総利益は粗利益とも呼ばれ、売上高−売上原価で求めます。"}, {"id": 3, "category": "ストラテジ", "topic": "企業と法務", "question": "貸借対照表に表示されるものはどれか。", "choices": ["売上高", "資産", "売上原価", "販管費"], "answer": 1, "explanation": "貸借対照表は資産・負債・純資産を示します。"}, {"id": 4, "category": "ストラテジ", "topic": "企業と法務", "question": "著作権で保護される対象として適切なものはどれか。", "choices": ["単なるアイデア", "プログラムの表現", "数学の公式そのもの", "業務手順の概念"], "answer": 1, "explanation": "著作権はアイデアではなく、文章・音楽・プログラムなどの具体的表現を保護します。"}, {"id": 5, "category": "ストラテジ", "topic": "企業と法務", "question": "個人情報保護法における個人情報の例として最も適切なものはどれか。", "choices": ["匿名化され復元できない統計値", "氏名と住所の組合せ", "会社全体の売上高", "公開された業界平均"], "answer": 1, "explanation": "氏名、住所、メールアドレスなど個人を識別できる情報は個人情報に該当します。"}, {"id": 6, "category": "ストラテジ", "topic": "企業と法務", "question": "不正アクセス禁止法で禁止される行為はどれか。", "choices": ["許可されたIDで自分のメールを読む", "他人のIDとパスワードで無断ログインする", "公開Webサイトを閲覧する", "自分のPCの設定を変更する"], "answer": 1, "explanation": "他人の識別符号を無断で使ってアクセスする行為は禁止されています。"}, {"id": 7, "category": "ストラテジ", "topic": "経営戦略", "question": "SWOT分析で自社内部のプラス要因はどれか。", "choices": ["機会", "脅威", "強み", "弱み"], "answer": 2, "explanation": "SWOTのSはStrength、つまり内部環境における強みです。"}, {"id": 8, "category": "ストラテジ", "topic": "経営戦略", "question": "PPMで市場成長率が高く相対的市場占有率も高い事業はどれか。", "choices": ["花形", "金のなる木", "問題児", "負け犬"], "answer": 0, "explanation": "花形は成長率・占有率とも高く、将来の収益源になり得ます。"}, {"id": 9, "category": "ストラテジ", "topic": "経営戦略", "question": "競争優位の源泉として差別化戦略に該当するものはどれか。", "choices": ["価格だけを徹底的に下げる", "独自機能やブランド価値で選ばれる", "全事業から撤退する", "在庫をゼロにする"], "answer": 1, "explanation": "差別化戦略は機能・品質・ブランドなどで他社と違いを出す戦略です。"}, {"id": 10, "category": "ストラテジ", "topic": "経営戦略", "question": "顧客との関係を管理し、販売やサポートに活用する考え方はどれか。", "choices": ["CRM", "SCM", "BPR", "MRP"], "answer": 0, "explanation": "CRMはCustomer Relationship Management、顧客関係管理です。"}, {"id": 11, "category": "ストラテジ", "topic": "経営戦略", "question": "調達から販売までの供給連鎖を全体最適化する考え方はどれか。", "choices": ["ERP", "SCM", "CRM", "MBO"], "answer": 1, "explanation": "SCMはSupply Chain Managementで、供給連鎖全体を管理します。"}, {"id": 12, "category": "ストラテジ", "topic": "経営戦略", "question": "既存の業務手順を抜本的に見直し再設計する考え方はどれか。", "choices": ["BPR", "OJT", "BCP", "KPI"], "answer": 0, "explanation": "BPRはBusiness Process Re-engineeringで、業務プロセスの根本的改革を指します。"}, {"id": 13, "category": "ストラテジ", "topic": "システム戦略", "question": "経営資源を統合管理する基幹業務パッケージはどれか。", "choices": ["ERP", "DNS", "IDS", "BIOS"], "answer": 0, "explanation": "ERPは会計・人事・販売・生産などの経営資源を統合的に管理します。"}, {"id": 14, "category": "ストラテジ", "topic": "システム戦略", "question": "企業のデータを分析し意思決定に活用する仕組みはどれか。", "choices": ["BI", "NAT", "RAID", "SMTP"], "answer": 0, "explanation": "BIはBusiness Intelligenceで、データ分析により意思決定を支援します。"}, {"id": 15, "category": "ストラテジ", "topic": "システム戦略", "question": "定型作業をソフトウェアロボットで自動化する仕組みはどれか。", "choices": ["RPA", "VPN", "WAF", "OSS"], "answer": 0, "explanation": "RPAはPC上の定型作業などを自動化する技術です。"}, {"id": 16, "category": "ストラテジ", "topic": "システム戦略", "question": "クラウドのSaaSの説明として適切なものはどれか。", "choices": ["OSやミドルウェアだけを借りる", "ソフトウェア機能をインターネット経由で利用する", "物理サーバだけを購入する", "通信回線だけを暗号化する"], "answer": 1, "explanation": "SaaSはアプリケーション機能をサービスとして利用する形態です。"}, {"id": 17, "category": "ストラテジ", "topic": "システム企画", "question": "RFPの目的として適切なものはどれか。", "choices": ["提案依頼書としてベンダに要件や条件を示す", "完成後の操作手順を記録する", "障害ログを圧縮する", "従業員の勤務表を作る"], "answer": 0, "explanation": "RFPはRequest For Proposalで、提案依頼書です。"}, {"id": 18, "category": "ストラテジ", "topic": "システム企画", "question": "システム化計画で最初に明確にすべきことはどれか。", "choices": ["導入目的と解決したい課題", "画面の色だけ", "開発者の昼食場所", "ケーブルの型番だけ"], "answer": 0, "explanation": "目的や業務課題を明確にしないと、適切な要件定義や効果測定ができません。"}, {"id": 19, "category": "ストラテジ", "topic": "企業と法務", "question": "KPIの説明として適切なものはどれか。", "choices": ["重要業績評価指標", "企業秘密保持契約", "暗号鍵の長さ ィ", "question": "情報セキュリティの三要素に含まれないものはどれか。", "choices": ["機密性", "完全性", "可用性", "装飾性"], "answer": 3, "explanation": "情報セキュリティの三要素は機密性・完全性・可用性です。"}, {"id": 102, "category": "テクノロジ", "topic": "情報メディア", "question": "音声や画像などの連続的な情報を数値化することはどれか。", "choices": ["デジタル化", "棚卸し", "減価償却", "監査"], "answer": 0, "explanation": "アナログ情報を標本化・量子化などでデジタルデータにします。"}, {"id": 103, "category": "テクノロジ", "topic": "基礎理論", "question": "1KBを1024バイトとして、1MBは何KBか。", "choices": ["100", "512", "1024", "2048"], "answer": 2, "explanation": "情報処理分野では1MB=1024KBとして扱う場合があります。"}];
let order = [...QUESTIONS.keys()];
let answers = JSON.parse(localStorage.getItem("itpass_answers_v1") || "{}");
let showAllExplanations = false;

const el = id => document.getElementById(id);
const list = el("list");

function save() {
  localStorage.setItem("itpass_answers_v1", JSON.stringify(answers));
}

function filtered() {
  const cat = el("category").value;
  const kw = el("keyword").value.trim().toLowerCase();
  return order.map(i => QUESTIONS[i]).filter(q => {
    const wrongOnly = cat === "wrong";
    if (wrongOnly && !(answers[q.id] !== undefined && answers[q.id] !== q.answer)) return false;
    if (!wrongOnly && cat !== "all" && q.category !== cat) return false;
    if (kw) {
      const text = (q.category + q.topic + q.question + q.choices.join("") + q.explanation).toLowerCase();
      if (!text.includes(kw)) return false;
    }
    return true;
  });
}

function render() {
  const qs = filtered();
  list.innerHTML = "";
  if (!qs.length) {
    list.innerHTML = '<div class="card">表示できる問題がありません。</div>';
  }
  for (const q of qs) {
    const chosen = answers[q.id];
    const answered = chosen !== undefined;
    const card = document.createElement("article");
    card.className = "card";
    card.innerHTML = `
      <div class="meta"><span class="badge">Q${q.id}</span><span class="badge">${q.category}系</span><span class="badge">${q.topic}</span></div>
      <div class="q">${escapeHtml(q.question)}</div>
      <div class="choices"></div>
      <div class="explain ${answered || showAllExplanations ? "show" : ""}">
        ${answered ? `<div class="result ${chosen === q.answer ? "good" : "bad"}">${chosen === q.answer ? "正解" : "不正解"}：正解は「${escapeHtml(q.choices[q.answer])}」</div>` : `<div class="result">正解：${escapeHtml(q.choices[q.answer])}</div>`}
        <div>${escapeHtml(q.explanation)}</div>
      </div>
    `;
    const choices = card.querySelector(".choices");
    q.choices.forEach((c, idx) => {
      const b = document.createElement("button");
      b.className = "choice";
      b.textContent = `${"ア イ ウ エ"[idx*2] || idx+1}. ${c}`;
      if (answered || showAllExplanations) {
        b.disabled = true;
        if (idx === q.answer) b.classList.add("correct");
        if (answered && idx === chosen && chosen !== q.answer) b.classList.add("wrong");
      }
      b.addEventListener("click", () => {
        if (answers[q.id] !== undefined) return;
        answers[q.id] = idx;
        save();
        render();
      });
      choices.appendChild(b);
    });
    list.appendChild(card);
  }
  updateStats(qs);
}

function updateStats(qs) {
  const allVisible = qs.length;
  const doneQs = qs.filter(q => answers[q.id] !== undefined);
  const correct = doneQs.filter(q => answers[q.id] === q.answer).length;
  el("total").textContent = allVisible;
  el("done").textContent = doneQs.length;
  el("correct").textContent = correct;
  el("rate").textContent = doneQs.length ? Math.round(correct / doneQs.length * 100) + "%" : "0%";
  el("bar").style.width = allVisible ? (doneQs.length / allVisible * 100) + "%" : "0%";
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

el("category").addEventListener("change", render);
el("keyword").addEventListener("input", render);
el("shuffle").addEventListener("click", () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  render();
  window.scrollTo({top:0, behavior:"smooth"});
});
el("reset").addEventListener("click", () => {
  if (confirm("解答履歴をリセットしますか？")) {
    answers = {};
    save();
    render();
  }
});
el("review").addEventListener("click", () => {
  showAllExplanations = !showAllExplanations;
  el("review").textContent = showAllExplanations ? "解説を隠す" : "解説をすべて表示";
  render();
});
render();
</script>
